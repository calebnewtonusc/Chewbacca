name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The installer is the thing most likely to break and was the only thing not
  # checked. 1411 lines of bash with five embedded Python heredocs, and CI
  # looked at links and secrets while a syntax error in either language would
  # have shipped. All three of these have caught a real bug already.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          for f in setup.sh doctor.sh install.sh add-skill.sh bin/*.sh bin/lib/*.sh bin/chewbacca bin/chrome-js bin/peekaboo bin/mac-use; do
            [ -f "$f" ] || continue
            bash -n "$f" || { echo "syntax error: $f"; exit 1; }
            echo "ok  $f"
          done

      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S error setup.sh doctor.sh install.sh add-skill.sh uninstall.sh bin/chewbacca bin/lib/*.sh

      - name: Embedded Python compiles
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          found = 0
          for f in pathlib.Path(".").glob("*.sh"):
              t = f.read_text()
              for m in re.finditer(r"python3[^\n]*<<\s*'?(\w+)'?\n(.*?)\n\1\n", t, re.S):
                  try:
                      compile(m.group(2), f"<{f}>", "exec")
                  except SyntaxError as e:
                      print(f"{f}: embedded python failed to compile: {e}")
                      sys.exit(1)
                  found += 1
          print(f"{found} embedded python blocks compile")
          if found == 0:
              print("expected to find embedded python; the matcher may have drifted")
              sys.exit(1)
          PY

      - name: Python tools compile
        run: |
          python3 -m py_compile bin/slop-check bin/secret-scan bin/mac_use_cli.py bin/mac_use_claude.py

      - name: setup.sh takes no interactive input
        run: |
          # The whole point of the flag rewrite. A reintroduced prompt makes the
          # installer un-runnable by an agent and un-runnable without a TTY.
          if grep -nE '^\s*read (-[a-z]+ )*' setup.sh; then
            echo "setup.sh must not read from stdin: pass a flag or use --answers"
            exit 1
          fi
          echo "ok  no read calls"

      - name: setup.sh help and dry-run work
        run: |
          bash setup.sh --help > /dev/null
          bash setup.sh --dry-run --name CI --repo-dir /tmp/ci | tee /tmp/dry
          grep -q "bypass perms:    no" /tmp/dry
          grep -q "session opener:  none" /tmp/dry
          echo "ok  both consequential defaults are off"

      - name: Every section is guarded by --only
        run: |
          # A section header not followed by `if should_run` runs on every
          # invocation, including --only. That bug rewrote a live machine's
          # global hooks during an --only prereq run, silently, because a new
          # header had been inserted mid-section and closed the guard early.
          python3 - <<'PY'
          import pathlib, re, sys
          UNGUARDED = {"Colors", "Inputs", "Collect info", "What this run turns on", "Done"}
          lines = pathlib.Path("setup.sh").read_text().splitlines()
          bad = []
          for i, line in enumerate(lines):
              m = re.match(r"^# ── (.+?) ─", line)
              if not m:
                  continue
              name = m.group(1).strip()
              if name in UNGUARDED:
                  continue
              nxt = lines[i + 1].strip() if i + 1 < len(lines) else ""
              if not nxt.startswith("if should_run"):
                  bad.append(f"line {i+1}: section '{name}' is not guarded")
          for b in bad:
              print(b)
          sys.exit(1 if bad else 0)
          PY

      - name: Skill evals are well formed and every skill has some
        run: |
          # Nine skills had evals and nothing ever ran them. Twelve had none.
          python3 tools/evals.py

      - name: Checksums cover what actually runs
        run: |
          # A lockfile for the executable surface. If a script changed and this
          # did not, the committed checksums are already lying.
          python3 tools/checksums.py --check

      - name: README counts match the tree
        run: |
          # The README said 42 skills, the tree had 21, and doctor reported 79.
          # Three numbers for one concept, none of them checked by anything.
          python3 tools/counts.py --check

      - name: Writing rules
        run: |
          # 60, not 0. The worst file in the tree is vendored from another
          # author and scores 55, and rewriting someone else's skill to pass
          # our house style is not the job. This catches a regression in the
          # kit's own prose without failing on inherited content.
          python3 bin/slop-check docs/ skills/ --max 60

  # The kit is macOS-only and had no macOS runner. Every behavioral test ran
  # on Ubuntu or not at all.
  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test suite
        run: bash tests/run.sh

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for broken internal links
        run: |
          echo "Checking for broken internal links..."
          ERRORS=0
          # Check markdown links that reference local files
          for file in $(find . -name "*.md" -not -path "./.git/*"); do
            # Extract [text](path) links that don't start with http
            grep -oP '\[.*?\]\(\K[^)]+' "$file" 2>/dev/null | while read -r link; do
              # Skip URLs, anchors, and mailto
              case "$link" in
                # '#' must be quoted. After a | bash reads a bare # as the
                # start of a comment, which swallowed the rest of the case and
                # made this step a syntax error on every run it ever had.
                http*|mailto*|'#'*) continue ;;
              esac
              # Resolve relative to the file's directory
              dir=$(dirname "$file")
              target="$dir/$link"
              # Strip anchor from path
              target="${target%%#*}"
              if [ ! -f "$target" ] && [ ! -d "$target" ]; then
                echo "BROKEN: $file -> $link"
                ERRORS=$((ERRORS + 1))
              fi
            done
          done
          if [ "$ERRORS" -gt 0 ]; then
            echo "$ERRORS broken link(s) found"
            exit 1
          fi
          echo "All internal links valid"

      - name: Check for hardcoded personal paths
        run: |
          echo "Checking for hardcoded personal paths..."
          ERRORS=0
          # These patterns should never appear in committed files
          PATTERNS="/Users/[a-z][a-z0-9._-]*|/home/[a-z][a-z0-9._-]*"
          if grep -rn "$PATTERNS" --include="*.md" --include="*.json" --include="*.sh" --include="*.ts" . | grep -v ".git/"; then
            echo "ERROR: Found hardcoded personal paths. Use variables instead."
            ERRORS=1
          fi
          if [ "$ERRORS" -gt 0 ]; then
            exit 1
          fi
          echo "No hardcoded personal paths found"

      - name: Check for leaked secrets
        run: |
          # The three prefixes this step used to grep for (sk-ant-api, ghp_,
          # ak_) missed a live Todoist token that sat in .claude/commands/*.md
          # for 149 days, because that token is forty bare hex characters
          # and is indistinguishable by shape from a git commit SHA. bin/secret-scan
          # matches on position instead: a long literal where a credential goes.

          # Prove the scanner still fires before trusting a pass. A check that
          # cannot fail is not a check. The fixture value is synthetic: the
          # scanner keys on shape and position, so a real secret is never needed
          # and must never be committed here.
          mkdir -p /tmp/secret-fixture
          # Assembled at runtime: a forty-character literal written here would
          # be flagged by the very scanner this step is testing.
          FAKE=$(python3 -c "print('0123456789abcdef' * 3)" | cut -c1-40)
          printf '%s\n' \
            "  -H \"Authorization: Bearer $FAKE\"" \
            '  -H "Authorization: Bearer $TODOIST_API_TOKEN"' \
            '  apiKey: process.env.ANTHROPIC_API_KEY' \
            > /tmp/secret-fixture/sample.md
          if python3 bin/secret-scan /tmp/secret-fixture > /tmp/fixture.out 2>&1; then
            echo "secret-scan failed to flag a known credential literal"
            cat /tmp/fixture.out
            exit 1
          fi
          test "$(grep -c ': credential literal' /tmp/fixture.out)" = 1 || {
            echo "expected exactly 1 finding, env-var forms should not fire"
            cat /tmp/fixture.out
            exit 1
          }
          echo "ok  scanner catches literals and ignores env references"

          python3 bin/secret-scan .
