name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The installer is the thing most likely to break and was the only thing not
  # checked. 1411 lines of bash with five embedded Python heredocs, and CI
  # looked at links and secrets while a syntax error in either language would
  # have shipped. All three of these have caught a real bug already.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          for f in setup.sh doctor.sh install.sh add-skill.sh bin/*.sh bin/chrome-js bin/peekaboo bin/mac-use; do
            [ -f "$f" ] || continue
            bash -n "$f" || { echo "syntax error: $f"; exit 1; }
            echo "ok  $f"
          done

      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S error setup.sh doctor.sh install.sh add-skill.sh

      - name: Embedded Python compiles
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          found = 0
          for f in pathlib.Path(".").glob("*.sh"):
              t = f.read_text()
              for m in re.finditer(r"python3[^\n]*<<\s*'?(\w+)'?\n(.*?)\n\1\n", t, re.S):
                  try:
                      compile(m.group(2), f"<{f}>", "exec")
                  except SyntaxError as e:
                      print(f"{f}: embedded python failed to compile: {e}")
                      sys.exit(1)
                  found += 1
          print(f"{found} embedded python blocks compile")
          if found == 0:
              print("expected to find embedded python; the matcher may have drifted")
              sys.exit(1)
          PY

      - name: Python tools compile
        run: |
          python3 -m py_compile bin/slop-check bin/mac_use_cli.py bin/mac_use_claude.py

      - name: setup.sh takes no interactive input
        run: |
          # The whole point of the flag rewrite. A reintroduced prompt makes the
          # installer un-runnable by an agent and un-runnable without a TTY.
          if grep -nE '^\s*read (-[a-z]+ )*' setup.sh; then
            echo "setup.sh must not read from stdin: pass a flag or use --answers"
            exit 1
          fi
          echo "ok  no read calls"

      - name: setup.sh help and dry-run work
        run: |
          bash setup.sh --help > /dev/null
          bash setup.sh --dry-run --name CI --repo-dir /tmp/ci | tee /tmp/dry
          grep -q "bypass perms:    no" /tmp/dry
          grep -q "session opener:  none" /tmp/dry
          echo "ok  both consequential defaults are off"

      - name: Every section is guarded by --only
        run: |
          # A section header not followed by `if should_run` runs on every
          # invocation, including --only. That bug rewrote a live machine's
          # global hooks during an --only prereq run, silently, because a new
          # header had been inserted mid-section and closed the guard early.
          python3 - <<'PY'
          import pathlib, re, sys
          UNGUARDED = {"Colors", "Inputs", "Collect info", "What this run turns on", "Done"}
          lines = pathlib.Path("setup.sh").read_text().splitlines()
          bad = []
          for i, line in enumerate(lines):
              m = re.match(r"^# ── (.+?) ─", line)
              if not m:
                  continue
              name = m.group(1).strip()
              if name in UNGUARDED:
                  continue
              nxt = lines[i + 1].strip() if i + 1 < len(lines) else ""
              if not nxt.startswith("if should_run"):
                  bad.append(f"line {i+1}: section '{name}' is not guarded")
          for b in bad:
              print(b)
          sys.exit(1 if bad else 0)
          PY

      - name: Writing rules
        run: |
          # 60, not 0. The worst file in the tree is vendored from another
          # author and scores 55, and rewriting someone else's skill to pass
          # our house style is not the job. This catches a regression in the
          # kit's own prose without failing on inherited content.
          python3 bin/slop-check docs/ skills/ --max 60

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for broken internal links
        run: |
          echo "Checking for broken internal links..."
          ERRORS=0
          # Check markdown links that reference local files
          for file in $(find . -name "*.md" -not -path "./.git/*"); do
            # Extract [text](path) links that don't start with http
            grep -oP '\[.*?\]\(\K[^)]+' "$file" 2>/dev/null | while read -r link; do
              # Skip URLs, anchors, and mailto
              case "$link" in
                # '#' must be quoted. After a | bash reads a bare # as the
                # start of a comment, which swallowed the rest of the case and
                # made this step a syntax error on every run it ever had.
                http*|mailto*|'#'*) continue ;;
              esac
              # Resolve relative to the file's directory
              dir=$(dirname "$file")
              target="$dir/$link"
              # Strip anchor from path
              target="${target%%#*}"
              if [ ! -f "$target" ] && [ ! -d "$target" ]; then
                echo "BROKEN: $file -> $link"
                ERRORS=$((ERRORS + 1))
              fi
            done
          done
          if [ "$ERRORS" -gt 0 ]; then
            echo "$ERRORS broken link(s) found"
            exit 1
          fi
          echo "All internal links valid"

      - name: Check for hardcoded personal paths
        run: |
          echo "Checking for hardcoded personal paths..."
          ERRORS=0
          # These patterns should never appear in committed files
          PATTERNS="/Users/[a-z][a-z0-9._-]*|/home/[a-z][a-z0-9._-]*"
          if grep -rn "$PATTERNS" --include="*.md" --include="*.json" --include="*.sh" --include="*.ts" . | grep -v ".git/"; then
            echo "ERROR: Found hardcoded personal paths. Use variables instead."
            ERRORS=1
          fi
          if [ "$ERRORS" -gt 0 ]; then
            exit 1
          fi
          echo "No hardcoded personal paths found"

      - name: Check for leaked secrets patterns
        run: |
          echo "Checking for potential secret leaks..."
          if grep -rn "sk-ant-api\|ghp_[a-zA-Z0-9]\{36\}\|ak_[a-zA-Z0-9]" --include="*.md" --include="*.json" --include="*.sh" --include="*.ts" . | grep -v ".git/" | grep -v "example\|placeholder\|YOUR_"; then
            echo "ERROR: Potential secrets found in committed files"
            exit 1
          fi
          echo "No leaked secrets found"
