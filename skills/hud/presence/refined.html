<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script
      src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"
      integrity="sha384-A1XhMANHciQ8ED89Ap5K0zOdmQKiEeXSjaN0sakNxIzq9Z2YfXV/BwHp7oP3z5ip"

    ></script>

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"

      src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"

  </head>
  <body
    class="antialiased overflow-hidden bg-zinc-950"

  >

    <canvas

    <div
      id="panel"
      class="fixed top-6 left-6 z-50 w-72 rounded-2xl bg-white/5 backdrop-blur-xl border border-white/10 p-5 shadow-2xl transition-opacity duration-200"
    >
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2 text-zinc-200">
          <i data-lucide="aperture" class="w-4 h-4 text-amber-400"></i>
          <span class="text-sm font-semibold tracking-tight"
            >Presence refined</span
          >
        </div>
        <button
          id="hide"
          class="text-zinc-500 hover:text-white px-2 py-1 rounded-lg hover:bg-white/5 transition-all duration-200 cursor-pointer"
          title="Hide panel (h)"

          <i data-lucide="chevron-up" class="w-4 h-4"></i>

      <div id="list" class="space-y-1 mb-4"></div>

      <button
        id="replay"
        class="w-full bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-zinc-950 font-semibold px-4 py-2.5 rounded-xl transition-all duration-200 shadow-lg shadow-amber-500/25 cursor-pointer flex items-center justify-center gap-2"
      >
        <i data-lucide="play" class="w-4 h-4"></i> Trigger
      </button>

      <div id="sliders" class="mt-4 space-y-3"></div>

      <div class="mt-4 pt-4 border-t border-white/10">
        <div class="text-xs text-zinc-500 mb-2">Backdrop</div>
        <div class="grid grid-cols-3 gap-2">
          <button
            data-bd="dark"
            class="bd bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-zinc-100 text-xs font-medium px-2 py-1.5 rounded-lg transition-all duration-200 cursor-pointer"
          >
            Dark
          </button>
          <button
            data-bd="photo"
            class="bd bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-zinc-100 text-xs font-medium px-2 py-1.5 rounded-lg transition-all duration-200 cursor-pointer"
          >

          <button
            data-bd="light"

      <div class="mt-4 pt-4 border-t border-white/10 space-y-1">

            id="fps"
            class="text-xs text-zinc-300"

          ></span>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-xs text-zinc-500">buffers</span>

            id="fmt"
            class="text-xs text-zinc-300"
            style="font-family: &quot;JetBrains Mono&quot;, monospace"
          ></span>
        </div>
      </div>
      <div
        id="errs"
        class="mt-2 text-xs text-rose-300"
        style="font-family: &quot;JetBrains Mono&quot;, monospace"

    </div>

    <div
      id="hint"
      class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 text-xs text-zinc-500 pointer-events-none"
      style="font-family: &quot;JetBrains Mono&quot;, monospace"
    >
      space trigger &nbsp;&middot;&nbsp; x pop &nbsp;&middot;&nbsp; h panel
    </div>

    <script>
      // ---------------------------------------------------------------------------
      // Three survivors, built properly.
      //
      // Two things changed from the ten-model sheet, and they are the two reasons
      // that sheet looked cheap.
      //
      // 1. GLOW IS NOW REAL. Before, every "glow" was exp(-d*k) painted straight into
      //    the pixel. That is a gradient, not light: it cannot spill across a shape,
      //    it cannot accumulate where two bright things overlap, and it clips flat at
      //    white. Here the scene renders to a half-float target, the bright part is
      //    extracted, blurred separably at two scales, and composited back. Highlights
      //    bleed, corners accumulate, and the falloff has the long dim tail that a
      //    real lens produces. It is the single biggest difference available.
      //
      // 2. ACTIVATIONS ARE CHOREOGRAPHED. The ten shared one easing curve so the
      //    comparison stayed honest, which also made all ten open the same way. Each
      //    of these runs its own multi-stage sequence with its own timings, because a
      //    single sine is the thing that reads as bland no matter how good the shape.
      //
      // Hairlines use fwidth for analytic antialiasing, so a line is the same weight
      // on a laptop and on a 6K panel. A line that thickens with resolution is the
      // other classic tell.
      // ---------------------------------------------------------------------------

      const QUAD_VS = `#version 300 es
precision highp float;
const vec2 V[3] = vec2[3](vec2(-1.0,-1.0), vec2(3.0,-1.0), vec2(-1.0,3.0));
out vec2 vUV;
void main(){
  vec2 p = V[gl_VertexID];
  vUV = p*0.5 + 0.5;
  gl_Position = vec4(p, 0.0, 1.0);
}`;

      const COMMON = `#version 300 es
precision highp float;
in vec2 vUV;
uniform vec2  u_res;
uniform float u_time;
uniform float u_act;
uniform vec2  u_cursor;
uniform float u_gain;
// Seconds since the close key, or negative when the bubble is still up.
uniform float u_close;
// Where the film ruptured, in uv.
uniform vec2  u_pop;
out vec4 o;

float hash11(float p){ return fract(sin(p*127.1)*43758.5453); }
float hash21(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float noise(vec2 p){
  vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(hash21(i), hash21(i+vec2(1.0,0.0)), f.x),
             mix(hash21(i+vec2(0.0,1.0)), hash21(i+vec2(1.0,1.0)), f.x), f.y);
}
float fbm(vec2 p){ float s=0.0,a=0.5; for(int i=0;i<4;i++){ s+=a*noise(p); p*=2.03; a*=0.5; } return s; }

// Easings. expo-out is what makes a move read as mechanical rather than soft:
// almost all of the distance is covered in the first fifth of the duration.
float expoOut(float x){ return x >= 1.0 ? 1.0 : 1.0 - pow(2.0, -10.0*x); }
float stage(float t, float a, float b){ return clamp((t-a)/(b-a), 0.0, 1.0); }
`;

      const MODELS = [
        {
          name: "Chromatic",
          note: "blown in from the edges, then it wobbles and settles",
          gain: 0.65,
          src: `
// Overall level of the film. Swept, see the commit.
#define SKIN 1.1

// Belcour and Barla's pre-integrated spectral response, verbatim from
// KHR_materials_iridescence. A soap film is not a hue ramp. It is the whole
// visible spectrum interfering with itself at one optical path difference,
// integrated against the eye's three sensitivities.
//
// The exp(-phase^2*var) term is the reason to use this rather than rotate a
// hue: it is why a thickening film washes out to pearl instead of cycling
// saturated rainbows forever, and cycling forever is exactly the tell that
// makes hand-rolled iridescence look like an oil slick decal.
vec3 film(float opd){
  float phase = 6.2831853*opd*1.0e-9;
  vec3 val = vec3(5.4856e-13, 4.4201e-13, 5.2481e-13);
  vec3 pos = vec3(1.6810e+06, 1.7953e+06, 2.2084e+06);
  vec3 vr  = vec3(4.3278e+09, 9.3046e+09, 6.6121e+09);
  vec3 xyz = val*sqrt(6.2831853*vr)*cos(pos*phase)*exp(-phase*phase*vr);
  xyz.x += 9.7470e-14*sqrt(6.2831853*4.5282e+09)
         * cos(2.2399e+06*phase)*exp(-4.5282e+09*phase*phase);
  xyz /= 1.0685e-7;
  return mat3( 3.2404542, -0.9692660,  0.0556434,
              -1.5371385,  1.8760108, -0.2040259,
              -0.4985314,  0.0415560,  1.0572252)*xyz;
}

// How deep into the film a point is, in screen heights, measured from a
// silhouette that sits a constant distance off every edge of the screen.
//
// The level sets of a superelliptic norm are rounded at every depth. A rounded
// rectangle's are not: that one only curves within its own corner radius of
// the boundary and goes back to square corners deeper in, which is the same
// failure as the Chebyshev metric it was meant to replace, just further from
// the edge. But the norm is taken per axis, so a fixed step in it is a longer
// step in pixels down the wide side of the screen. Dividing by its own
// gradient turns it back into a distance. The margin is then a constant offset
// outward rather than a scale, which is what keeps the frame the same
// thickness all the way round while still putting the screen corners inside
// it. The floor on the gradient is only there to stop the estimate running
// away near the middle of the screen, where the norm has no useful gradient
// and the answer is just "far".
float depthAt(vec2 uvp, float W, float margin){
  vec2 r2 = (uvp - 0.5)*2.0;
  const float SQ = 4.0;
  float rad = pow(pow(abs(r2.x), SQ) + pow(abs(r2.y), SQ), 1.0/SQ);
  float gk  = pow(max(rad, 1e-3), 1.0 - SQ);
  vec2  g   = vec2(gk*pow(abs(r2.x), SQ - 1.0)*(2.0/W),
                   gk*pow(abs(r2.y), SQ - 1.0)*2.0);
  return min((1.0 - rad)/max(length(g), 0.6) + margin, 0.95);
}

void main(){
  vec2 uv = vUV;
  float t = u_act;
  float W = u_res.x/u_res.y;

  // One breath drives the film thickness and its resting depth together. Two
  // sines at their own rates read as two layers sitting on each other rather
  // than as one object. The phase is modulated so the swing is not symmetric,
  // because a breath is not: it moves through the thin half faster than it
  // rests in the thick.
  float bp = u_time*0.72;
  float breath = sin(bp + 0.45*sin(bp));

  // --- being blown ---------------------------------------------------------
  // The whole intro is one number: how far into the screen the film reaches.
  // You are standing inside the bubble, so a wall inflating toward you sweeps
  // the band in from all four edges until the film is over nearly everything,
  // and the wall settling back takes it out again.
  //
  // It does not stop dead when it arrives. A bubble that has just left the
  // wand oscillates in its second shape mode, in and out, with the decay set
  // by viscosity, and it crosses its rest radius three or four times before it
  // is done. That wobble is the part that reads as liquid rather than as
  // hardware, and it is why this is a damped cosine where every other move in
  // this file is an expoOut.
  float REST = 0.300, PEAK = 1.10;
  float band;
  if (t < 0.30) {
    band = PEAK*expoOut(stage(t, 0.0, 0.30));
  } else {
    // The wobble is multiplicative, so an inward swing divides the depth
    // instead of subtracting from it and can never reach zero. Written as a
    // subtraction the first return took the band to four percent of the
    // screen, which reads as the thing blinking out rather than wobbling, and
    // the floor I put under it to stop that was also holding the band above
    // zero at t=0, so the film was already lit before the intro began.
    float x = t - 0.30;
    band = REST*pow(PEAK/REST, exp(-6.0*x)*cos(x*14.0));
  }

  // The frame breathes. Not the colour in it, which it was already doing: the
  // boundary itself, in and out by a seventh of its own depth, on the same
  // slow asymmetric cycle as everything else here.
  band *= 1.0 + 0.145*breath;

  // Nothing at all before the film arrives.
  float born = smoothstep(0.0, 0.07, band);

  // Domain warped noise. The field is sampled at coordinates that are
  // themselves displaced by another sample of it, twice. Plain noise gives
  // soft round blobs. This gives drawn out filaments and folded sheets,
  // because on a real film the thickness is not sitting still: it is being
  // carried around by convection in the liquid, and the streaks are the flow.
  vec2 p = uv*vec2(W, 1.0)*1.25;
  float dt = u_time*0.035;
  vec2 w1 = vec2(fbm(p + vec2(0.0, dt)), fbm(p + vec2(5.2, 1.3) - dt*0.7));
  vec2 w2 = vec2(fbm(p + 3.4*w1 + vec2(1.7, 9.2) + dt*0.5),
                 fbm(p + 3.4*w1 + vec2(8.3, 2.8)));
  float flow = fbm(p + 3.2*w2);

  // --- the shape -----------------------------------------------------------
  // The silhouette sits off every edge of the screen, so the film runs out
  // past all four sides and fills the corners instead of stopping short of
  // them. You are inside the bubble: its outline is behind you, not on the
  // monitor. The only boundary in view is the inner one, and that is the one
  // doing the work.
  vec2 q = (uv - 0.5)*vec2(W, 1.0);
  const float MARGIN = 0.200;

  float inward = depthAt(uv, W, MARGIN);

  // Two slow lobes move the whole boundary, so it creeps and folds rather than
  // holding an exact offset from the screen.
  inward += (fbm(q*3.4 + vec2( u_time*0.155, -u_time*0.118)) - 0.5)*0.060
          + (fbm(q*6.6 + vec2(-u_time*0.081,  u_time*0.136)) - 0.5)*0.028;

  float u0 = clamp(inward/band, 0.0, 1.0);

  // A capillary ripple on the inner edge alone, four times faster than the
  // lobes. Without it the boundary is one shape being slid around, which is
  // legible as a single rigid outline however much it wanders. With it the
  // edge itself is working, which is the part that reads as liquid.
  //
  // Frequency matters more than amplitude here. At seventeen cycles across the
  // screen this same term read as torn paper, because fbm's fourth octave was
  // landing at six pixels and a six pixel wobble on a boundary is not a wave,
  // it is a serration.
  // The drift is mostly vertical while the lobes below run sideways, so the
  // edge detail climbs through a boundary that is sliding across it.
  inward += (fbm(q*6.5 + vec2(-u_time*0.085, u_time*0.50)) - 0.5)*0.030
          * smoothstep(0.30, 1.0, u0);

  // --- oil in water --------------------------------------------------------
  // Where the film runs thick it stops holding still. The boundary bulges
  // inward, the bulge necks off, and what leaves is a drop of the same film
  // travelling into the dark. It cannot hold itself together out there for
  // long, so it thins, goes quiet, and is gone.
  //
  // The drop is not drawn. It declares a depth into the band and min() lets it
  // win against the frame's own, so everything downstream shades it as film:
  // the same interference colour, the same Fresnel, the same lip terminating
  // its rim. Two earlier passes drew these as circles with a colour on top of
  // the scene, and a circle with a colour is what they looked like, however
  // carefully the colour was chosen.
  float ub = inward/max(band, 1e-3);
  if (ub > 0.35 && ub < 1.80) {
    const float CELL = 0.170;
    vec2 cid = floor(q/CELL);
    for (int j = -1; j <= 1; j++)
    for (int i = -1; i <= 1; i++) {
      vec2  cc = cid + vec2(float(i), float(j));
      float h0 = hash21(cc), h1 = hash21(cc + 41.7);

      // Jitter is held under a sixth of a cell. Two neighbours are then never
      // closer than seven tenths of a cell, which is more than twice the
      // largest radius below, so no two drops can touch whatever phase they
      // are each in.
      vec2  anchor = (cc + 0.5 + (vec2(h0, h1) - 0.5)*0.30)*CELL;
      float ad     = depthAt(anchor/vec2(W, 1.0) + 0.5, W, MARGIN);
      float onEdge = exp(-pow((ad - band)/0.085, 2.0));
      if (onEdge < 0.35) continue;

      // Slow. A cycle runs nine to sixteen seconds and almost all of it is the
      // drop travelling: the point is that the film got too heavy, not that
      // anything here is energetic.
      float cyc = 9.0 + 7.0*hash21(cc + 93.1);
      float ph  = u_time/cyc + h0*11.0;
      float k   = fract(ph), gen = floor(ph);
      if (hash21(cc + gen*17.3) < 0.42) continue;
      if (fbm(anchor*3.0 + vec2(u_time*0.02, 0.0)) < 0.46) continue;

      float hr = hash21(cc + gen*3.7);

      // Swell, leave, thin, gone. The exit is a fade rather than a burst: this
      // one is small enough that surface tension loses quietly.
      float swell = smoothstep(0.00, 0.20, k);
      float fade  = 1.0 - smoothstep(0.87, 1.00, k);
      float R = (0.030 + 0.020*hr)*swell*(0.60 + 0.40*fade);
      if (R < 1e-4) continue;

      // It stays attached while the swell is still growing, because the centre
      // has barely moved and the drop and the boundary are still the same
      // sheet. The neck breaks on its own once travel outruns the radius.
      vec2  cen = anchor + normalize(-anchor)*(0.085 + 0.070*h1)*smoothstep(0.26, 0.95, k);
      float r   = length(q - cen)/R;
      if (r > 1.12) continue;

      // The drop is a small sphere, and its own grazing angle runs the other
      // way round from the frame's: straight through at the middle, fully edge
      // on at the limb. Mapping that onto the same depth coordinate is what
      // makes the shading below draw it as a bubble, a bright limb around a
      // nearly clear middle, instead of as a disc of colour with a ring on it.
      // Written the obvious way round it was the disc, and the only reason it
      // read at all was the frame's own lip happening to land near its edge.
      // The range is deliberately narrow, a fifth to seven tenths of the
      // band. Run edge to edge it sweeps a full interference order between the
      // limb and the middle and crosses the frame's own lip on the way, and
      // what that draws is a bullseye. A bubble this size shows one colour
      // with a gradient across it, not five rings.
      float ct = sqrt(max(1.0 - min(r, 1.0)*min(r, 1.0), 0.0));
      float dd = mix(0.20, 0.72, ct)*band;

      // Two ways out, and both are the same move: slide past the band's own
      // termination and stop existing. One ends the limb, the other is the
      // drop dying. Quiet, no burst.
      //
      // onEdge stays out of this. Folded in as a strength it pushed every drop
      // that was not perfectly placed past the termination too, so the only
      // ones that ever rendered were the handful sitting exactly on the
      // boundary. It decides whether a drop forms, not how real it is.
      dd = mix(dd, band*1.10, max(smoothstep(0.90, 1.10, r), 1.0 - fade));
      inward = min(inward, dd);
    }
  }

  // Off the silhouette there is no bubble to draw. On screen this is one
  // everywhere, because the silhouette is off the edge: it is here for the
  // case where a lobe drags the boundary past a corner.
  float lit = smoothstep(0.0, 0.006, inward);

  // The sheen tilts toward the pointer. Iridescence is the one colour that is
  // a function of where you are looking from, and on a flat panel the only
  // thing standing in for a viewing angle is the cursor. Reads as -9999 with
  // no mouse on screen, which falls off to nothing on its own.
  float glance = exp(-length(gl_FragCoord.xy - u_cursor)/300.0);

  // Across the band the line of sight rolls from straight through the film to
  // fully edge on at the silhouette. That is the geometry of standing inside a
  // bubble and looking at its edge, and it is why the colour belongs at the
  // edge of the screen in the first place.
  float u = clamp(inward/band, 0.0, 1.0);

  // Refract it and use the real path length. cos of the refracted angle only
  // falls to 0.66 at full grazing, so the orders compress into the silhouette
  // rather than multiplying without limit. That crowding is the thin bright
  // band of stacked colour on the outside of every bubble.
  float cosI = u;
  float sinT = sqrt(max(1.0 - cosI*cosI, 0.0))/1.33;
  float cosT = sqrt(max(1.0 - sinT*sinT, 0.0));

  // A fixed amount of liquid spread over a surface that is still growing, so
  // the film thins as it blows. This is the part you actually watch when
  // somebody blows a bubble: the bands sweep down through the orders while the
  // wall is stretching, and they stop sweeping when it stops growing. Nothing
  // else in the intro had to be animated to make it read as inflation.
  float stretch = mix(2.6, 1.0, smoothstep(0.0, 0.70, t));

  // Gravity drains the film downward, so it is thinnest at the top. On a real
  // bubble this is the cue that says the surface is liquid rather than glass.
  float nm = (345.0 + 215.0*flow - (uv.y - 0.5)*130.0
           + 40.0*breath + 90.0*glance)*cosT*stretch;

  // Two-beam reflectance, not the bare integral. film() is the AC part alone
  // and decays to zero as the film thickens, so normalising it by its own
  // luminance hands back a fully saturated colour from what ought to be an
  // almost colourless thick film. Adding the DC term first is what makes the
  // high orders wash out to pearl. The minus sign is the half-wave shift at
  // the front face, which is also why a film goes black just before it pops.
  vec3 refl = max(0.5*(vec3(1.0) - film(2.0*1.33*nm)), vec3(0.0));

  // Fresnel. Physically the body of a film returns four percent and the
  // silhouette returns nearly all of it, and driving the band with that ratio
  // is what stops it reading as paint. But taken literally it is also a ramp
  // from bright to nothing across three hundred pixels, and a ramp is a
  // vignette however it was derived. Compressed to a bit under two to one, so
  // the angle is still legible and the band still has a body.
  float fres = 0.30 + 0.70*pow(1.0 - cosI, 2.5);

  // The band ends rather than fading out, over about a tenth of its own
  // depth. A long ramp down to nothing is a vignette, and a vignette is not a
  // film: a real one has an inner boundary you can point at, and that
  // boundary is the thing carrying the flow.
  float env = 1.0 - smoothstep(0.90, 1.0, u);

  // The film's colour with its brightness divided out, for the places that
  // want the hue without the level: the silhouette line and the rim of a pop.
  vec3 sheen = normalize(refl + vec3(0.0015));

  vec3 c = refl*fres*env*SKIN*born*lit;

  // The inner boundary is a lip, not a place the gradient ran out. Liquid held
  // by surface tension beads along its own edge and the bead catches light, so
  // the thing that reads as an edge is a bright line sitting on it. Without
  // this the termination is invisible and the band goes back to being a fade
  // no matter how short the fade is.
  c += exp(-pow((u - 0.90)/0.052, 2.0))*0.26
     * mix(vec3(1.0), sheen, 0.65)*born*lit;


  // --- the pop --------------------------------------------------------------
  // Nothing below is eased. A rupturing film does not decelerate: the hole
  // opens at the speed where surface tension balances the film's own inertia,
  // and high speed footage shows that speed holding constant from the first
  // frame to the last. Every other move in this file is an expoOut. This one
  // is a straight line, and that is most of why it reads as a rupture rather
  // than as a transition out.
  //
  // A real one is over in fifteen milliseconds, which is a single frame here.
  // It runs at 340, slow enough to see and still far faster than anything else
  // this thing does.
  if (u_close >= 0.0) {
    float k = u_close;
    vec2  d = (uv - u_pop)*vec2(W, 1.0);
    float r = length(d), ang = atan(d.y, d.x);

    // The film thins where it is about to go. In a real bubble this is the
    // black spot: the two surfaces come within a wavelength of each other and
    // their reflections cancel, so the last thing you see before it bursts is
    // darkness opening in a place that still has film in it.
    c *= 1.0 - 0.9*exp(-r*13.0)*stage(k, 0.0, 0.10);

    float R = max(k - 0.10, 0.0)*7.0;

    // Smooth while the rim is thin, then shear against the still air tears
    // indentations into it. They appear past a critical radius, which is why a
    // pop ends in a scatter instead of starting as one.
    float tear = smoothstep(0.30, 0.95, R);
    float edge = R*(1.0 + 0.10*tear*sin(ang*13.0 + 1.7));

    // Everything the hole has already crossed is gone.
    c *= smoothstep(edge - 0.02, edge + 0.01, r);

    // The film the hole swallowed has to go somewhere, and it collects in the
    // rim of the hole. That is why the edge of a bursting bubble is brighter
    // than the film was, and why fading one out looks nothing like one.
    float ring = exp(-pow((r - edge)/0.014, 2.0))*(0.35 + R*1.1)*(1.0 - tear*0.5);
    c += ring*mix(vec3(1.0), sheen, 0.55);

    // Drops thrown out of the indentations, flying a little ahead of the rim
    // that threw them.
    float b  = floor((ang + 3.14159265)*15.0/6.2831853);
    float sd = hash11(b*7.31);
    float detach = 0.30 + sd*0.55;
    if (R > detach) {
      float dr = detach + (R - detach)*1.45;
      float da = (b + 0.5)/15.0*6.2831853 - 3.14159265 + (sd - 0.5)*0.26;
      c += exp(-pow(length(d - vec2(cos(da), sin(da))*dr)/0.011, 2.0))
         * 1.5*exp(-(R - detach)*1.7);
    }

    // Past the far corner there is nothing left to throw.
    c *= 1.0 - stage(k, 0.44, 0.60);
  }

  o = vec4(c*1.9*u_gain, 1.0);
}
`,
        },
      ];

      // --- bloom ------------------------------------------------------------------
      const BRIGHT_FS =
        COMMON.split("in vec2 vUV;")[0] +
        `
in vec2 vUV;
uniform sampler2D uTex;
uniform float uThresh;
out vec4 o;
void main(){
  vec3 c = texture(uTex, vUV).rgb;
  // Soft knee. A hard threshold makes the bloom pop on and off as something
  // crosses it, which flickers on anything that breathes.
  float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
  float k = smoothstep(uThresh, uThresh + 0.55, l);
  o = vec4(c*k, 1.0);
}`;

      const BLUR_FS = `#version 300 es
precision highp float;
in vec2 vUV;
uniform sampler2D uTex;
uniform vec2 uDir;      // texel-sized step, horizontal or vertical
out vec4 o;
void main(){
  // Nine-tap gaussian, separable. Weights are a real binomial kernel; an
  // even box blur leaves visible square structure in a wide bloom.
  float w[5] = float[5](0.2270270270, 0.1945945946, 0.1216216216, 0.0540540541, 0.0162162162);
  vec3 c = texture(uTex, vUV).rgb * w[0];
  for(int i=1;i<5;i++){
    vec2 off = uDir*float(i);
    c += texture(uTex, vUV + off).rgb * w[i];
    c += texture(uTex, vUV - off).rgb * w[i];
  }
  o = vec4(c, 1.0);
}`;

      const DOWN_FS = `#version 300 es
precision highp float;
in vec2 vUV;
uniform sampler2D uTex;
out vec4 o;
void main(){ o = vec4(texture(uTex, vUV).rgb, 1.0); }`;

      const COMP_FS = `#version 300 es
precision highp float;
in vec2 vUV;
uniform sampler2D uScene, uBloomA, uBloomB;
uniform float uBloom, uTime, uExposure;
out vec4 o;
float hash21(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
void main(){
  vec3 c = texture(uScene, vUV).rgb;
  c += (texture(uBloomA, vUV).rgb*0.62 + texture(uBloomB, vUV).rgb*1.00)*uBloom;
  c *= uExposure;
  // Reinhard. Without a tonemap every hot pixel clips to flat white and the
  // whole thing looks like a blown-out screenshot, which is most of "cheap".
  c = c/(1.0 + c);
  // Temporal dither at one 8-bit step. Smooth falloffs band visibly without it
  // and banding is the fastest way to make a gradient look amateur.
  c += (hash21(gl_FragCoord.xy + fract(uTime)) - 0.5)/255.0;
  c = max(c, vec3(0.0));
  float a = clamp(max(max(c.r,c.g),c.b), 0.0, 1.0);
  o = vec4(c, a);      // premultiplied for compositing over the page
}`;

      const canvas = document.getElementById("gl");
      const gl = canvas.getContext("webgl2", {
        alpha: true,
        premultipliedAlpha: true,
        antialias: false,
      });
      if (!gl) {
        document.body.innerHTML =
          '<div class="fixed inset-0 grid place-items-center text-zinc-300">WebGL2 unavailable in this browser.</div>';
        throw new Error("no webgl2");
      }
      // Half-float targets let the scene carry values above 1.0, which is what makes
      // a bright core bloom further than a dim one. On RGBA8 everything clips at 1
      // and the bloom is uniform, which defeats the point.
      const canFloat =
        !!gl.getExtension("EXT_color_buffer_half_float") ||
        !!gl.getExtension("EXT_color_buffer_float");
      gl.getExtension("OES_texture_float_linear");
      const HDR = canFloat ? gl.RGBA16F : gl.RGBA8;
      document.getElementById("fmt").textContent = canFloat
        ? "RGBA16F"
        : "RGBA8 (no HDR)";

      const errs = [];
      function compile(type, src) {
        const sh = gl.createShader(type);
        gl.shaderSource(sh, src);
        gl.compileShader(sh);
        if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
          const log = gl.getShaderInfoLog(sh);
          gl.deleteShader(sh);
          throw new Error(log);
        }
        return sh;
      }
      function program(fs, label) {
        try {
          const p = gl.createProgram();
          gl.attachShader(p, compile(gl.VERTEX_SHADER, QUAD_VS));
          gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
          gl.linkProgram(p);
          if (!gl.getProgramParameter(p, gl.LINK_STATUS))
            throw new Error(gl.getProgramInfoLog(p));
          return p;
        } catch (e) {
          // Console too, and the whole log. Pushing only the first line into a
          // panel nobody is looking at turns a one line compile error into a
          // black screen with no explanation, which is exactly how an
          // undeclared identifier survived three rounds of probing.
          console.error("shader " + label + "\n" + e.message);
          errs.push(label + ": " + String(e.message).split("\n")[0]);
          return null;
        }
      }

      for (const m of MODELS) {
        m.prog = program(COMMON + m.src, m.name);
        if (m.prog) {
          m.u = {};
          for (const n of [
            "u_res",
            "u_time",
            "u_act",
            "u_cursor",
            "u_gain",
            "u_close",
            "u_pop",
          ])
            m.u[n] = gl.getUniformLocation(m.prog, n);
        }
      }
      const pBright = program(BRIGHT_FS, "brightpass");
      const pBlur = program(BLUR_FS, "blur");
      const pDown = program(DOWN_FS, "downsample");
      const pComp = program(COMP_FS, "composite");
      document.getElementById("errs").textContent = errs.join(" | ");

      const vao = gl.createVertexArray();
      const draw = () => {
        gl.bindVertexArray(vao);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      };

      function makeTarget() {
        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        const fbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferTexture2D(
          gl.FRAMEBUFFER,
          gl.COLOR_ATTACHMENT0,
          gl.TEXTURE_2D,
          tex,
          0,
        );
        return { tex, fbo, w: 0, h: 0 };
      }
      const T = {
        scene: makeTarget(),
        a1: makeTarget(),
        a2: makeTarget(),
        b1: makeTarget(),
        b2: makeTarget(),
      };

      function sizeTarget(t, w, h) {
        if (t.w === w && t.h === h) return;
        t.w = w;
        t.h = h;
        gl.bindTexture(gl.TEXTURE_2D, t.tex);
        gl.texImage2D(
          gl.TEXTURE_2D,
          0,
          HDR,
          w,
          h,
          0,
          gl.RGBA,
          canFloat ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE,
          null,
        );
      }

      let W = 0,
        H = 0,
        PW = 0,
        PH = 0;
      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        PW = Math.round(W * dpr);
        PH = Math.round(H * dpr);
        canvas.width = PW;
        canvas.height = PH;
        sizeTarget(T.scene, PW, PH);
        const hw = Math.max(1, PW >> 1),
          hh = Math.max(1, PH >> 1);
        const qw = Math.max(1, PW >> 2),
          qh = Math.max(1, PH >> 2);
        sizeTarget(T.a1, hw, hh);
        sizeTarget(T.a2, hw, hh);
        sizeTarget(T.b1, qw, qh);
        sizeTarget(T.b2, qw, qh);
      }
      window.addEventListener("resize", resize);
      resize();

      function pass(prog, target, setup) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fbo : null);
        gl.viewport(0, 0, target ? target.w : PW, target ? target.h : PH);
        gl.useProgram(prog);
        setup(prog);
        draw();
      }
      function bindTex(prog, name, t, unit) {
        gl.activeTexture(gl.TEXTURE0 + unit);
        gl.bindTexture(gl.TEXTURE_2D, t.tex);
        gl.uniform1i(gl.getUniformLocation(prog, name), unit);
      }

      const P = {
        bloom: { v: 1.0, min: 0, max: 3, step: 0.01, label: "Bloom" },
        thresh: {
          v: 0.55,
          min: 0,
          max: 2,
          step: 0.01,
          label: "Bloom threshold",
        },
        exposure: { v: 1.05, min: 0.2, max: 3, step: 0.01, label: "Exposure" },
        gain: { v: 1.0, min: 0.1, max: 4, step: 0.01, label: "Scene gain" },
      };

      const params = new URLSearchParams(location.search);
      const FREEZE = params.get("freeze");
      const frozen = FREEZE === null ? null : parseFloat(FREEZE);
      let current = Math.max(
        0,
        Math.min(MODELS.length - 1, parseInt(params.get("m") || "0", 10) || 0),
      );
      let actStart = performance.now();
      let closeStart = null;
      let popAt = [0.5, 1.0];
      const trigger = () => {
        actStart = performance.now();
        closeStart = null;
      };
      const close = () => {
        if (closeStart !== null) return;
        // Nucleate on the rim. From inside a bubble the film is only visible
        // where you are looking through it edge on, so the rim is the only
        // part of it you could watch a hole open in.
        const f = Math.random(), side = (Math.random() * 4) | 0;
        popAt =
          side === 0
            ? [f, 1.0]
            : side === 1
              ? [f, 0.0]
              : side === 2
                ? [0.0, f]
                : [1.0, f];
        closeStart = performance.now();
      };

      const list = document.getElementById("list");
      function paintList() {
        [...list.children].forEach((el, i) => {
          const on = i === current;
          el.className =
            "w-full text-left px-3 py-2 rounded-lg transition-all duration-200 cursor-pointer flex items-baseline gap-2.5 " +
            (on
              ? "bg-amber-500/15 border border-amber-500/40"
              : "border border-transparent hover:bg-white/5");
          el.querySelector(".k").className =
            "k text-xs " + (on ? "text-amber-400" : "text-zinc-600");
          el.querySelector(".n").className =
            "n text-sm font-medium " +
            (on ? "text-amber-200" : "text-zinc-300");
        });
      }
      MODELS.forEach((m, i) => {
        const b = document.createElement("button");
        b.innerHTML = `<span class="k" style="font-family:'JetBrains Mono',monospace">${i + 1}</span>
                 <span class="min-w-0"><span class="n">${m.name}</span>
                 <span class="block text-xs text-zinc-500 leading-snug">${m.note}</span></span>`;
        b.addEventListener("click", () => {
          current = i;
          paintList();
          trigger();
        });
        list.appendChild(b);
      });
      paintList();

      const sliders = document.getElementById("sliders");
      for (const [key, p] of Object.entries(P)) {
        const row = document.createElement("div");
        row.innerHTML = `
    <div class="flex items-center justify-between mb-1">
      <label class="text-xs text-zinc-400">${p.label}</label>
      <span class="text-xs text-zinc-300" style="font-family:'JetBrains Mono',monospace" id="v_${key}">${p.v}</span>
    </div>
    <input type="range" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.v}"
           class="w-full h-1 rounded-full bg-zinc-700 appearance-none cursor-pointer accent-amber-500">`;
        const input = row.querySelector("input");
        input.addEventListener("input", () => {
          p.v = parseFloat(input.value);
          document.getElementById("v_" + key).textContent = p.v;
        });
        sliders.appendChild(row);
      }

      document.getElementById("replay").addEventListener("click", trigger);
      const panel = document.getElementById("panel");
      document
        .getElementById("hide")
        .addEventListener("click", () => panel.classList.toggle("opacity-0"));
      window.addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          e.preventDefault();
          trigger();
          return;
        }
        if (e.key === "x" || e.code === "Escape") {
          e.preventDefault();
          close();
          return;
        }
        if (e.key === "h") {
          panel.classList.toggle("opacity-0");
          return;
        }
        const n = parseInt(e.key, 10);
        if (n >= 1 && n <= MODELS.length) {
          current = n - 1;
          paintList();
          trigger();
        }
      });

      const BACKDROPS = {
        dark: "#0a0a0a",
        photo:
          "radial-gradient(ellipse at 20% 15%, #1e1b4b 0%, #0a0a0a 55%), radial-gradient(ellipse at 85% 80%, #422006 0%, transparent 60%)",
        light: "#f4f4f5",
      };
      function setBackdrop(k) {
        document.getElementById("backdrop").style.background = BACKDROPS[k];
        document.querySelectorAll(".bd").forEach((b) => {
          const on = b.dataset.bd === k;
          b.classList.toggle("bg-amber-500/15", on);
          b.classList.toggle("border-amber-500/40", on);
          b.classList.toggle("text-amber-300", on);
        });
      }
      document
        .querySelectorAll(".bd")
        .forEach((b) =>
          b.addEventListener("click", () => setBackdrop(b.dataset.bd)),
        );
      setBackdrop("photo");

      let cursor = [-9999, -9999],
        target = [-9999, -9999];
      window.addEventListener("mousemove", (e) => {
        target = [(e.clientX * PW) / W, ((H - e.clientY) * PH) / H];
      });

      const fpsEl = document.getElementById("fps");
      let last = performance.now(),
        acc = 0,
        frames = 0;

      function render(now) {
        const dt = Math.min((now - last) / 1000, 0.05);
        last = now;
        acc += dt;
        frames++;
        if (acc > 0.5) {
          fpsEl.textContent = (frames / acc).toFixed(0) + " fps";
          acc = 0;
          frames = 0;
        }
        cursor[0] += (target[0] - cursor[0]) * Math.min(dt * 14, 1);
        cursor[1] += (target[1] - cursor[1]) * Math.min(dt * 14, 1);

        const m = MODELS[current];
        if (!m.prog || !pBright || !pBlur || !pComp || !pDown) {
          requestAnimationFrame(render);
          return;
        }

        // Overridable so the idle can be sampled at a known phase. The breath
        // and the film drift are both slow, and eyeballing a 9 second cycle is
        // how you end up calling a dead frame alive.
        const tNow =
          window.__t != null ? window.__t : frozen !== null ? 12.0 : now / 1000;
        const tAct =
          window.__act != null
            ? window.__act
            : frozen !== null
              ? frozen
              : (now - actStart) / 1000;

        gl.disable(gl.BLEND);

        pass(m.prog, T.scene, () => {
          gl.uniform2f(m.u.u_res, PW, PH);
          gl.uniform1f(m.u.u_time, tNow);
          gl.uniform1f(m.u.u_act, tAct);
          gl.uniform2f(m.u.u_cursor, cursor[0], cursor[1]);
          gl.uniform1f(m.u.u_gain, m.gain * P.gain.v);
          gl.uniform1f(
            m.u.u_close,
            window.__close != null
              ? window.__close
              : closeStart === null
                ? -1.0
                : (now - closeStart) / 1000,
          );
          const pop = window.__pop || popAt;
          gl.uniform2f(m.u.u_pop, pop[0], pop[1]);
        });

        pass(pBright, T.a1, (p) => {
          bindTex(p, "uTex", T.scene, 0);
          gl.uniform1f(gl.getUniformLocation(p, "uThresh"), P.thresh.v);
        });
        pass(pBlur, T.a2, (p) => {
          bindTex(p, "uTex", T.a1, 0);
          gl.uniform2f(gl.getUniformLocation(p, "uDir"), 1.0 / T.a1.w, 0.0);
        });
        pass(pBlur, T.a1, (p) => {
          bindTex(p, "uTex", T.a2, 0);
          gl.uniform2f(gl.getUniformLocation(p, "uDir"), 0.0, 1.0 / T.a2.h);
        });
        pass(pDown, T.b1, (p) => bindTex(p, "uTex", T.a1, 0));
        pass(pBlur, T.b2, (p) => {
          bindTex(p, "uTex", T.b1, 0);
          gl.uniform2f(gl.getUniformLocation(p, "uDir"), 1.0 / T.b1.w, 0.0);
        });
        pass(pBlur, T.b1, (p) => {
          bindTex(p, "uTex", T.b2, 0);
          gl.uniform2f(gl.getUniformLocation(p, "uDir"), 0.0, 1.0 / T.b2.h);
        });

        pass(pComp, null, (p) => {
          bindTex(p, "uScene", T.scene, 0);
          bindTex(p, "uBloomA", T.a1, 1);
          bindTex(p, "uBloomB", T.b1, 2);
          gl.uniform1f(gl.getUniformLocation(p, "uBloom"), P.bloom.v);
          gl.uniform1f(gl.getUniformLocation(p, "uExposure"), P.exposure.v);
          gl.uniform1f(gl.getUniformLocation(p, "uTime"), tNow);
        });

        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);
      lucide.createIcons();
    </script>
  </body>
</html>
