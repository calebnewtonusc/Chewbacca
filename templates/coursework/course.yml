# course.yml: one file per course, in $COURSEWORK_DIR/courses/.
# Name it after the course: courses/acad-324g.yml
#
# Fill this from the syllabus, not from memory. Every deadline carries a
# `source` naming the page it came from, so a wrong date can be traced to a
# misreading instead of argued about.

code: EXMP 101
title: The Full Course Title From The Syllabus
units: 4
section: "12345"
term: Fall 2026
syllabus: "~/coursework/syllabi/exmp-101.pdf"

instructor:
  name: Dr. Example Instructor
  email: instructor@example.edu
  office: BLDG 123
  office_hours: "Tue 3-4pm, Wed 10-11am, or by appointment"

# Every meeting: lecture, lab, discussion section. `label` distinguishes them.
meets:
  - {
      days: [Mon, Wed],
      start: "10:00",
      end: "11:50",
      room: "BLDG 213",
      label: lecture,
    }
  - { days: [Fri], start: "10:00", end: "11:50", room: "BLDG 258", label: lab }

# The single most important block in the file. Before helping with any graded
# work, Claude reads `policies.ai` and says out loud what this course allows.
# Quote the syllabus. Do not summarize a ban into "be careful".
policies:
  ai: >-
    Quote the syllabus verbatim. Example of a ban: "The use of AI tools,
    including generative AI such as ChatGPT, is not permitted for assignments,
    exams, or other course-related work unless explicitly authorized."
    Example of disclosure-required: "You are expected to clearly attribute any
    material generated by the tool used. Include a paragraph at the end of any
    assignment that uses AI explaining how and why you used it and the prompts."
  late: "10% off under 24h, 20% at 24-48h, 50% at 48h-3 days, no credit past 3 days"
  attendance: "Two absences, no explanation. Each one after drops the final grade by a third of a letter."
  exams: "No makeup exams. Email the instructor within 48 hours of a missed exam."
  grading: "Standard scale. A 95-100, A- 90-94, B+ 87-89, B 83-86."
  regrade: "Within one week of the exam being returned, with the full request format the syllabus specifies."

# What an absence actually costs, in numbers, so the CLI can do the arithmetic
# instead of you doing it at 2am.
absences:
  allowed: 2
  used: 0
  penalty: "-1/3 of a letter grade each, after the first two"
  tardy_rule: "3 tardies = 1 absence. More than 15 minutes late = a full absence."
  makeup: "none"

# grading_model: weighted (default) or contract.
# Contract-graded courses (labor-based writing classes, for example) are not
# arithmetic on scores, so the CLI refuses to model them and points you at the
# policy instead of inventing a number.
grading_model: weighted
grading:
  # Give `weight` as a percentage, or `points` and let the CLI normalize.
  # `score` is a percentage unless you also give `max`, in which case it is
  # raw points out of max. Leave `score` out until it is actually graded.
  - { name: Midterm 1, points: 100 }
  - { name: Midterm 2, points: 100 }
  - { name: Final exam, points: 100 }
  - { name: Lab assignments, points: 100 }
  - { name: Weekly quizzes, points: 20 }

# Everything with a date. Exams, projects, drafts, quizzes, readings that get
# graded. status: todo | doing | done | skipped.
deliverables:
  - name: Project 1 Origin Story
    due: 2026-09-09
    at: "10:00"
    type: project
    weight: 10
    status: todo
    source: "syllabus p12, weekly schedule"
    notes: "5-page writing plus artifact. Rubric posted on the LMS."
  - name: Midterm 1
    due: 2026-10-02
    type: exam
    weight: 24
    status: todo
    source: "syllabus p7, lectures and exams schedule"
    notes: "Chapters 1-5. 60 minutes, no notes."

# Recurring work the schedule does not date individually. The CLI ignores this;
# it is here so Claude can build a weekly rhythm around it.
recurring:
  - {
      name: "Review quiz",
      cadence: "posted Fri 6pm, closes Mon 9am",
      where: "LMS",
    }
  - {
      name: "Reading response",
      cadence: "before each Wednesday session",
      where: "LMS",
    }
